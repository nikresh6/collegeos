+name: Neon Storage Mirror
+
+on:
+  workflow_dispatch:
+    inputs:
+      execute:
+        description: Upload and verify files in Neon
+        required: true
+        default: false
+        type: boolean
+
+permissions:
+  contents: read
+
+concurrency:
+  group: collegeos-neon-storage-mirror
+  cancel-in-progress: false
+
+jobs:
+  mirror:
+    runs-on: ubuntu-latest
+    timeout-minutes: 60
+    env:
+      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
+      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
+      SUPABASE_STORAGE_BUCKETS: course-files,lecture-audio
+      NEON_ARCHIVE_BUCKET: ${{ vars.NEON_ARCHIVE_BUCKET }}
+      AWS_ENDPOINT_URL_S3: ${{ secrets.NEON_AWS_ENDPOINT_URL_S3 }}
+      AWS_REGION: ${{ vars.NEON_AWS_REGION }}
+      AWS_ACCESS_KEY_ID: ${{ secrets.NEON_AWS_ACCESS_KEY_ID }}
+      AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_AWS_SECRET_ACCESS_KEY }}
+
+    steps:
+      - uses: actions/checkout@v6
+      - uses: actions/setup-python@v6
+        with:
+          python-version: "3.12"
+          cache: pip
+      - run: pip install -r requirements/archive.txt
+      - name: Inventory source storage
+        if: ${{ !inputs.execute }}
+        run: python scripts/mirror_storage_to_neon.py
+      - name: Mirror and verify in Neon
+        if: ${{ inputs.execute }}
+        run: python scripts/mirror_storage_to_neon.py --execute
+
